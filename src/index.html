<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' blob: data:; media-src 'self' file: blob: data:; img-src 'self' file: blob: data:;"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcomVideoStudio — Ecom Academy</title><link rel="stylesheet" href="style.css"></head><body>
<svg id="fxDefs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<header class="topbar"><div class="brand"><img class="logo" src="logo.png" alt="EcomVideoStudio"><div><strong>EcomVideoStudio</strong><small>Professional Desktop Editor</small></div></div><div class="top-actions"><button id="newBtn">＋ Nouveau</button><button id="openProject">Ouvrir</button><button id="saveProject">Sauvegarder</button><button class="exportBtn" id="exportBtn">Exporter</button></div></header>
<div class="workspace"><aside class="sidebar"><button class="tool active" data-panel="media">▣<span>Médias</span></button><button class="tool" data-panel="audio">♫<span>Audio</span></button><button class="tool" data-panel="text">T<span>Texte</span></button><button class="tool" data-panel="stickers">☺<span>Stickers</span></button><button class="tool" data-panel="captions">CC<span>Légendes</span></button><button class="tool" data-panel="effects">✦<span>Effets</span></button><button class="tool" data-panel="transitions">◈<span>Transitions</span></button><div class="side-bottom">⚙<small>Paramètres</small></div></aside>
<section class="leftpanel"><div class="panel-head"><h2 id="panelTitle">Médias</h2><button id="importBtn" class="primary">Importer</button></div><div id="panelContent"></div></section>
<main class="center"><div class="upper"><div class="preview"><div class="preview-bg"><div id="frame"><div id="layers"></div><div id="captionLayer"></div><div id="selBox"><i class="hd" data-h="nw"></i><i class="hd" data-h="ne"></i><i class="hd" data-h="sw"></i><i class="hd" data-h="se"></i></div></div><div id="emptyPreview">Importez des médias puis glissez-les sur la timeline</div></div><div class="preview-controls"><button id="play">▶</button><span id="time">00:00 / 00:00</span><div class="scrub" id="scrub"><div id="scrubFill"></div></div><div class="ratio-group" id="ratioGroup" title="Format de la vidéo"><button data-ratio="9:16"><i class="rb r916"></i>9:16</button><button data-ratio="16:9"><i class="rb r169"></i>16:9</button><button data-ratio="4:5"><i class="rb r45"></i>4:5</button><button data-ratio="1:1"><i class="rb r11"></i>1:1</button></div></div></div>
<aside class="inspector" id="inspector"></aside></div>
<div class="timeline-head"><div><button id="splitBtn">✂ Couper</button><button id="deleteBtn">🗑 Supprimer</button><button id="addAudioTrack">＋ Ajouter piste audio</button></div><div class="zoom">− <input id="zoom" type="range" min="10" max="150" value="40"> ＋</div></div>
<div class="timeline" id="timeline"></div></main></div>
<div class="statusbar"><span id="status">Prêt</span><span class="credit">Créé par Ecom Academy &nbsp;•&nbsp; Mail : ecom.academy.tg@gmail.com</span><span>MP4 • H.264 • Windows 10+</span></div>
<div class="modal hidden" id="exportModal"><div class="modal-card"><h2>Exporter la vidéo</h2><p id="exportInfo">Choisissez la qualité de sortie.</p><div class="quality-grid"><button data-res="480"><b>480p</b><small>Économique • Web & mobile</small></button><button data-res="1080" class="selected"><b>1080p</b><small>Full HD • Haute qualité</small></button></div><label class="chk"><input type="checkbox" id="burnCaps" checked> Incruster les légendes dans la vidéo</label><div class="exp-bar hidden" id="expBar"><div id="expFill"></div></div><div class="modal-actions"><button id="cancelExport">Fermer</button><button id="doExport" class="exportBtn">Exporter MP4</button></div><pre id="exportLog"></pre></div></div>
<script src="anim.js"></script><script src="effects.js"></script><script src="renderer.js"></script></body></html>
